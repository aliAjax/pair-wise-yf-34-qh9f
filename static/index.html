<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>无人机空域协调台</title>
<style>body{font:15px system-ui;max-width:1100px;margin:40px auto;background:#f3f6fa;padding:0 20px;color:#172033}section{background:white;padding:20px;border-radius:12px;margin:16px 0;box-shadow:0 2px 12px #0001}pre{background:#101828;color:#fde68a;padding:16px;border-radius:8px;overflow:auto}input,button{font:inherit;padding:8px;margin:4px}button{background:#4338ca;color:white;border:0;border-radius:6px}h2{font-size:17px}</style>
<h1>无人机空域协调台</h1><p>查看飞行计划、空域限制与监管抽查对账。提交、审核、变更、回执和裁决通过 JSON API 完成。</p>
<section>
身份：<input id="u" value="reviewer"> 角色：<input id="r" value="airspace_reviewer"> 运营方：<input id="op" value="OP1">
<button onclick="load()">刷新</button>
<h2>计划与限制</h2><pre id="o"></pre>
<h2>抽查对账（待复核 / 已核销 / 补证期限 / 待回执）</h2><pre id="c"></pre>
</section>
<script>
async function load(){
  let h={'X-User-Id':u.value,'X-Role':r.value,'X-Operator':op.value};
  let x=await fetch('/api/state',{headers:h});o.textContent=JSON.stringify(await x.json(),null,2);
  let y=await fetch('/api/recon/console',{headers:h});c.textContent=JSON.stringify(await y.json(),null,2);
}
load()
</script>
